services:
  autosklearn-worker:
    build:
      context: .
      dockerfile: autosklearn_worker/Dockerfile

    container_name: autosklearn-worker

    ports:
      - "8010:8010"

    volumes:
      - ./artifacts/autosklearn:/artifacts

    environment:
      - ARTIFACT_DIR=/artifacts

      # Background que se crea durante el entrenamiento.
      - SHAP_BACKGROUND_SIZE=50
      - SHAP_BACKGROUND_RANDOM_STATE=42

      # Primera evaluación: muestra estratificada de 60 publicaciones.
      # Para el resultado global final, cambiar este valor a 832.
      - SHAP_MAX_EXPLAIN_ROWS=832

      # Con tres variables existen 2^3 - 2 = 6 coaliciones
      # no triviales.
      - SHAP_NSAMPLES=6